# Every setting a batch's config.yml can hold, with the value it takes when the config leaves
# it out. One marked required has none. This file is where those values come from: simfbdr
# reads it, so what it says is what happens. `simfbdr config default batch` prints it.
# Times are in whatever unit the rates are per.

# uses: [paleobuddy@1.1.0]        # optional. Refused unless what simfbdr runs is at these versions:
#                                 # any of simfbdr, R, paleobuddy, as `simfbdr uses` prints them.

timeline:
  rate_intervals:                  # required. piecewise-constant rate intervals
  interval_width:                  # required. width of each interval; the oldest runs on to the origin
  present: 0                       # the process and its record end here, not at zero; younger occurrences are discarded

origin_age:                        # origin ~ Uniform(min, max). with tree.extant_species the origin is an output,
  min:                             # required. and these are only the bounds of a run's uniform origin prior
  max:                             # required

tree:
  anagenesis: false                # true: species also arise by anagenesis, each lineage splitting at rate
                                   # lambda_a, drawn per replicate from the speciation prior, constant in time
  extant_species:                  # unset, trees run forward from a drawn origin_age. set, they are drawn
                                   # backward from exactly this many extant species

rate_prior:                        # PyRate's: an independent gamma draw for each rate in each interval
  lambda:                          # the speciation rate
    shape:                         # required. PyRate's -pL is 1.1
    rate:                          # unset, it is drawn per replicate from Uniform(0, rate_parameter_max) and
                                   # estimated, which is what PyRate does when the shift times are fixed
  mu:                              # the extinction rate
    shape:                         # required. PyRate's -pM is 1.1
    rate:
  psi:                             # the fossil sampling rate
    shape:                         # required. PyRate's -pP is 1.5
    rate:                          # required. PyRate's is 1.1
  rate_parameter_max: 20           # lambda and mu only

record:
  rho:                             # the extant sampling probability. unset, every lineage alive at the
                                   # present is seen, and a run may assume any value
  occurrence_bins:
    width:                         # required. occurrence ages are reported to these bins
    oldest_edge:                   # required
    also_widths:                   # a list. the same record on other grids too, as occurrences_<model>_w<width>; 0 is the exact ages
    also_offsets:                  # a list. each of those shifted by this fraction of a bin as well, as ..._o<offset>

accepted_replicates:
  min_taxa: 1                      # a replicate outside these bounds is redrawn
  max_taxa:                        # no ceiling
  taxa_counted: fossil             # fossil: fossil-sampled taxa only; record: survivors seen at the present too
  min_fossil_taxa: 0

psi_mixture:                       # unset, every species samples fossils at psi
  components:                      # K. each species draws one of K relative rates at its birth, independently
                                   # of its parent: a discretized gamma of shape alpha with equal weights,
                                   # so psi stays the mean rate
  alpha_prior_rate: 1              # alpha ~ Exponential(this), drawn per replicate

characters:                        # unset, no characters are simulated
  count:                           # characters that change only at speciation, starting from uniform states
  states: 2                        # one number for every character, or a list with one per character
  epsilon_prior:                   # epsilon ~ Beta(alpha, beta), drawn per replicate. At each speciation,
    alpha: 1                       # each character of the new species changes with probability epsilon,
    beta: 9                        # to a state drawn uniformly from the others

simulation_limits:
  max_expected_lineages:           # no ceiling
  max_waiting_time_draws:          # no ceiling
