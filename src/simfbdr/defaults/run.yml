# Every setting a run's config.yml can hold, with the value it takes when the config leaves
# it out. One marked required has none. This file is where those values come from: simfbdr
# reads it, so what it says is what happens. `simfbdr config default run` prints it.

# uses: [rb@28e5b2]               # optional. Refused unless what simfbdr runs is at these versions:
#                                 # any of simfbdr, rb, as `simfbdr uses` prints them.

inference:
  model:                        # required. fbdrp: dnFBDRP; bds: dnBDS; fbdsp: dnFBDSP, the tree process
  occurrences:                  # required. the batch's occurrences_<this> directory
  reporting_model:              # required. complete | firstlast | presence
  occurrence_ages: reported     # reported | midpoint | drawn. midpoint puts each occurrence at its
                                # bin's middle, drawn at a uniform draw within it, as an exact age
  age_draws: 1                  # when drawn: this many draws, a chain each, pooled into one
                                # posterior per replicate, which is PyRate's practice
  condition:                    # required. time | sampling | survival | nTaxa
  rho:                          # required. the extant sampling probability the analysis assumes
  origin_prior: uniform      # uniform | exponential | none. none supplies no origin at all, so
                             # the oldest birth is the process start under an improper flat
                             # prior and the matrix moves sample it
  monitor_latents: true          # false writes the rates only, so there are no latent ranks
  range_start: origination       # origination | divergence. origination is the species' own start,
                                 # which both processes report; divergence is where the range attaches
                                 # to the nearest sampled one, which only dnFBDRP has
  coexistence:                   # left out, each process keeps its own published default: dnFBDRP
                                 # weights every birth by the lineages alive to produce it, dnBDS does not
  drop_present_only_taxa: false # bds only
  psi_mixture: false            # true assumes the batch's psi mixture and estimates alpha; false analyzes
                                # the same data under a single psi. fbdrp only
  characters: false             # true adds the batch's characters under dnPhyloMorphospeciation and
                                # estimates epsilon. fbdsp only

mcmc:
  generations:                  # required
  sample_every:                 # required
  seed: 1                       # each replicate's chain is seeded with this plus its number
